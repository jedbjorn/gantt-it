name: release

# Tag-driven GitHub Release (docs/RELEASING.md).
#
# Push a tag v<a.b.c>[-<prerelease>] (v1.0.0, v1.0.0-rc.1) and this workflow:
#   1. prepare — validates the tag and resolves the version from it
#                (v1.0.0-rc.1 -> 1.0.0-rc.1; MSI ProductVersion 1.0.0).
#   2. build   — runs the full _build.yml pipeline (tests, the four
#                configuration builds, the MSI) against the tagged commit,
#                stamping that version into the assemblies (and so into the
#                AppVersion every chart records) and the MSI.
#   3. release — creates the GitHub Release for the tag with
#                GanttIt-<version>.msi and the two manual-install zips
#                attached and auto-generated notes; marked pre-release when
#                the tag has a hyphenated suffix.
#
# Nothing else publishes a release; pushes to main never tag.
#
# Manual runs (Actions > release > Run workflow) are ALWAYS dry runs: they take
# a version, run prepare + build exactly as a tag would, and stop short of
# creating the release, printing what would have been published instead. Use
# them to rehearse a release or to produce a test MSI with a chosen version.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse, without the v (e.g. 1.0.0-rc.1). Dry run: nothing is published.'
        type: string
        required: true

# Read-only by default; only the release job may write (create the release).
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" && "$REF_TYPE" == "tag" ]]; then
            tag="$REF_NAME"; publish=true
          else
            tag="v${INPUT_VERSION#v}"; publish=false
          fi
          version="${tag#v}"
          # SemVer-shaped: numeric a.b.c (each part fits an MSI ProductVersion),
          # optional -prerelease of dot-separated alphanumerics.
          if ! [[ "$version" =~ ^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,4})(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::'$tag' is not v<major>.<minor>.<patch>[-<prerelease>]"
            exit 1
          fi
          if (( BASH_REMATCH[1] > 255 || BASH_REMATCH[2] > 255 || BASH_REMATCH[3] > 65535 )); then
            echo "::error::'$version' exceeds the MSI ProductVersion range (255.255.65535)"
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "tag $tag -> version $version (MSI ProductVersion ${version%%-*}); prerelease=$prerelease publish=$publish"

  build:
    needs: prepare
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  release:
    name: GitHub Release${{ needs.prepare.outputs.publish != 'true' && ' (dry run)' || '' }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: GanttIt-msi
          path: dist/
      - uses: actions/download-artifact@v7
        with:
          name: GanttIt-zips
          path: dist/

      - name: Check release assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ls -l dist/
          for f in "GanttIt-$VERSION.msi" "GanttIt-$VERSION-Revit2026.zip" "GanttIt-$VERSION-Revit2027.zip"; do
            [[ -s "dist/$f" ]] || { echo "::error::missing release asset $f"; exit 1; }
          done
          (cd dist && sha256sum -- * | tee SHA256SUMS.txt)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
        run: |
          set -euo pipefail
          args=(release create "$TAG" dist/* --title "Gantt-It $TAG" --generate-notes --verify-tag)
          [[ "$PRERELEASE" == "true" ]] && args+=(--prerelease)
          if [[ "$PUBLISH" != "true" ]]; then
            echo "Dry run — would run: gh ${args[*]}"
            exit 0
          fi
          gh "${args[@]}"
