name: build

# CI for every PR and push to main (spec §8, decision #12). This is the only
# off-VM build seat: the host has no .NET SDK.
#
# Delegates to the reusable _build.yml so release.yml builds exactly the same
# pipeline: Core tests, the six configuration builds (Debug R25/R26/R27
# upload the GanttIt-Debug-R25 / -R26 / -R27 add-in artifacts), and the
# Windows MSI job (GanttIt-msi, GanttIt-zips). Every job is required. Push/PR builds carry the
# dev version (0.0.0-dev; MSI ProductVersion 0.0.0).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # id-token: write only because _build.yml's msi job declares it for tag
    # signing, and GitHub checks a called workflow's permissions against the
    # caller's before any `if` (without it: "The nested job 'msi' is
    # requesting 'id-token: write', but is only allowed 'id-token: none'").
    # This workflow never signs: it passes no `sign`, so the msi job names no
    # environment and runs no login step, and Entra trusts only tokens with
    # the subject repo:jedbjorn/gantt-it:environment:signing.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_build.yml
